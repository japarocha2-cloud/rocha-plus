<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rocha+ Receiver</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#05040a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
    body{display:grid;place-items:center}
    .brand{position:fixed;top:28px;left:36px;font-size:34px;font-weight:900;letter-spacing:.2px}
    .brand b{color:#ffc43d}.brand span{color:#16f34a}
    .status{position:fixed;bottom:34px;left:36px;color:#cfd4d9;font-size:18px}
    .glow{width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#173f22 0,#0a1610 45%,transparent 72%);display:grid;place-items:center;box-shadow:0 0 70px rgba(22,243,74,.2)}
    .play{font-size:120px;color:#16f34a;filter:drop-shadow(0 0 24px rgba(22,243,74,.55))}
  </style>
</head>
<body>
  <div class="brand"><b>Rocha</b><span>+</span></div>
  <div class="glow"><div class="play">▶</div></div>
  <div id="status" class="status">Pronto para transmissão</div>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const context = cast.framework.CastReceiverContext.getInstance();
    const player = context.getPlayerManager();
    const status = document.getElementById('status');

    player.addEventListener(cast.framework.events.EventType.LOAD, (event) => {
      const title = event?.media?.metadata?.title || 'Conteúdo Rocha+';
      status.textContent = 'Carregando: ' + title;
    });

    player.addEventListener(cast.framework.events.EventType.PLAYING, () => {
      status.textContent = 'Transmitindo agora';
    });

    player.addEventListener(cast.framework.events.EventType.ERROR, () => {
      status.textContent = 'Não foi possível reproduzir este sinal';
    });

    context.start({
      disableIdleTimeout: true,
      statusText: 'Rocha+ pronto'
    });
  </script>
</body>
</html>
