name: Build Rocha+

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_login:
        description: Gerar APK assinada com login Firebase real
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ROCHA_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_login && secrets.ROCHA_KEYSTORE_PASSWORD || '' }}
      ROCHA_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_login && secrets.ROCHA_KEY_ALIAS || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Generate Android scaffold
        run: |-
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          path.write_text(text)
          PY
      - name: Configure Android phone and TV
        run: python3 tools/configure_android.py
      - name: Test Android configuration
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Prepare signed Firebase build
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        env:
          ROCHA_KEYSTORE_BASE64: ${{ secrets.ROCHA_KEYSTORE_BASE64 }}
          ROCHA_FIREBASE_CONFIG_JSON: ${{ secrets.ROCHA_FIREBASE_CONFIG_JSON }}
        run: python3 tools/prepare_signed_build.py
      - name: Get dependencies
        run: flutter pub get
      - name: Rocha+ Quality Guard
        run: python3 tools/rocha_quality_guard.py
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Rocha+ Quality Guard (post-tests)
        run: python3 tools/rocha_quality_guard.py
      - name: Build universal APK
        run: flutter build apk --release --build-number=${{ github.run_number }} ${ROCHA_FIREBASE_FILE:+--dart-define-from-file="$ROCHA_FIREBASE_FILE"}
      - name: Build optimized APKs
        run: flutter build apk --release --build-number=${{ github.run_number }} ${ROCHA_FIREBASE_FILE:+--dart-define-from-file="$ROCHA_FIREBASE_FILE"} --split-per-abi
      - name: Build Play Store bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }} ${ROCHA_FIREBASE_FILE:+--dart-define-from-file="$ROCHA_FIREBASE_FILE"}
      - name: Verify release evidence
        run: python3 tools/release_evidence.py
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-release-evidence
          path: build/qa/release-evidence.json
          if-no-files-found: error
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-play-store
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove private build inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rocha-private"
