name: Build Rocha+

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_login:
        description: Gerar beta com login real (requer 4 Secrets de assinatura/Firebase)
        type: boolean
        default: true
      cazetv_video_id:
        description: ID de video oficial CazeTV para candidato de teste (opcional; nao comprova reproducao)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CAZETV_YOUTUBE_VIDEO_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_login && inputs.cazetv_video_id || '' }}
      ROCHA_KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_login && secrets.ROCHA_KEYSTORE_PASSWORD || '' }}
      ROCHA_KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_login && secrets.ROCHA_KEY_ALIAS || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Generate Android scaffold
        run: |-
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          path.write_text(text)
          PY
      - name: Configure Android phone and TV
        run: python3 tools/configure_android.py
      - name: Test Android configuration
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Prepare signed Firebase build
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        env:
          ROCHA_KEYSTORE_BASE64: ${{ secrets.ROCHA_KEYSTORE_BASE64 }}
          ROCHA_FIREBASE_CONFIG_JSON: ${{ secrets.ROCHA_FIREBASE_CONFIG_JSON }}
        run: python3 tools/prepare_signed_build.py
      - name: Get dependencies
        run: flutter pub get
      - name: Rocha+ Quality Guard
        run: python3 tools/rocha_quality_guard.py
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Rocha+ Quality Guard (post-tests)
        run: python3 tools/rocha_quality_guard.py
      - name: Validate configured official CazeTV source
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        run: python3 tools/validate_cazetv_source.py
      - name: Build universal APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        run: flutter build apk --release --build-number=${{ github.run_number }} ${ROCHA_FIREBASE_FILE:+--dart-define-from-file="$ROCHA_FIREBASE_FILE"} --dart-define="CAZETV_YOUTUBE_VIDEO_ID=$CAZETV_YOUTUBE_VIDEO_ID"
      - name: Build optimized APKs
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        run: flutter build apk --release --build-number=${{ github.run_number }} ${ROCHA_FIREBASE_FILE:+--dart-define-from-file="$ROCHA_FIREBASE_FILE"} --dart-define="CAZETV_YOUTUBE_VIDEO_ID=$CAZETV_YOUTUBE_VIDEO_ID" --split-per-abi
      - name: Build Play Store bundle
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        run: flutter build appbundle --release --build-number=${{ github.run_number }} ${ROCHA_FIREBASE_FILE:+--dart-define-from-file="$ROCHA_FIREBASE_FILE"} --dart-define="CAZETV_YOUTUBE_VIDEO_ID=$CAZETV_YOUTUBE_VIDEO_ID"
      - name: Verify release evidence
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        run: python3 tools/release_evidence.py
      - name: Upload release evidence
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-release-evidence
          path: build/qa/release-evidence.json
          if-no-files-found: error
      - name: Upload CazeTV source metadata evidence
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-cazetv-source-metadata
          path: build/qa/cazetv-source.json
          if-no-files-found: error
      - name: Upload universal APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-beta-login-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload ARM64 APK
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-beta-login-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
      - name: Upload Play Store AAB
        if: github.event_name == 'workflow_dispatch' && inputs.signed_login
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-beta-login-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      # Generated only for visual QA. No Firebase credentials or access to streams.
      - name: Build visual-only layout preview APK
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signed_login) }}
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=ROCHA_LAYOUT_PREVIEW=true
      - name: Upload visual-only layout preview APK
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.signed_login) }}
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-layout-preview-no-channels
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Explain build mode and downloadable artifacts
        if: always()
        env:
          ROCHA_SIGNED_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.signed_login && 'true' || 'false' }}
        run: |
          if [ "$ROCHA_SIGNED_REQUESTED" = "true" ]; then
            echo "### Rocha+ beta com login Firebase" >> "$GITHUB_STEP_SUMMARY"
            echo "Somente se esta execucao tiver sucesso: baixe rocha-plus-beta-login-universal." >> "$GITHUB_STEP_SUMMARY"
            echo "A conexao ao Google ainda exige teste no aparelho e SHA da assinatura registrado no Firebase." >> "$GITHUB_STEP_SUMMARY"
            echo "Se houver falha em Prepare signed Firebase build, confira os Secrets no GitHub; nunca os publique." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Rocha+ SOMENTE PREVIA VISUAL" >> "$GITHUB_STEP_SUMMARY"
            echo "Baixe rocha-plus-layout-preview-no-channels. O login e os canais reais nao funcionam neste APK." >> "$GITHUB_STEP_SUMMARY"
            echo "Para testar login real: Actions > Build Rocha+ > Run workflow > signed_login=true." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove private build inputs
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rocha-private"
