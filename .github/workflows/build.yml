name: Build Rocha+

# V2 validation: player + Google Cast + branding

on:
  push:
    branches: [main, v2-build-validation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rocha+ Support audit
        run: python3 tools/rocha_support.py

      - name: Upload Rocha+ Support report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-support-report
          path: |
            rocha-support-report.md
            rocha-support-report.json
          if-no-files-found: warn

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |-
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          path.write_text(text)
          PY

      - name: Configure Android sender and branding
        run: |-
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          cast_permission = '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />'
          if permission not in text:
              text = text.replace('<application', f'    {permission}\n    <application', 1)
          if cast_permission not in text:
              text = text.replace('<application', f'    {cast_permission}\n    <application', 1)


          cast_meta = (
              '<meta-data\n'
              '                android:name="com.google.android.gms.cast.framework.OPTIONS_PROVIDER_CLASS_NAME"\n'
              '                android:value="com.felnanuke.google_cast.GoogleCastOptionsProvider" />'
          )
          if 'OPTIONS_PROVIDER_CLASS_NAME' not in text:
              text = text.replace('</application>', '    ' + cast_meta + '\n    </application>', 1)

          cast_service = (
              '<service\n'
              '                android:name="com.google.android.gms.cast.framework.media.MediaNotificationService"\n'
              '                android:exported="false"\n'
              '                android:foregroundServiceType="mediaPlayback" />'
          )
          if 'MediaNotificationService' not in text:
              text = text.replace('</application>', '    ' + cast_service + '\n    </application>', 1)

          text = text.replace('android:label="rocha_plus"', 'android:label="Rocha+"')
          text = text.replace(
              'android:icon="@mipmap/ic_launcher"',
              'android:icon="@drawable/rocha_plus_icon" android:roundIcon="@drawable/rocha_plus_icon"',
          )
          manifest.write_text(text)

          launcher_icon = Path("branding/rocha_plus_icon.webp")

          drawable = Path("android/app/src/main/res/drawable")
          drawable.mkdir(parents=True, exist_ok=True)
          drawable.joinpath("rocha_plus_icon.webp").write_bytes(
              launcher_icon.read_bytes()
          )

          PY

      - name: Preflight source sweep
        run: |-
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          root = Path('.')
          required = [
              root / 'branding/rocha_plus_icon.webp',
              root / 'lib/src/screens/player_screen.dart',
              root / 'lib/src/cast/cast_hls_proxy.dart',
          ]
          for path in required:
              if not path.exists() or path.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty required file: {path}')

          forbidden_paths = [
              root / 'assets/rocha_intro.mp4',
              root / 'assets/rocha_plus_icon.png',
              root / 'branding/rocha_plus_icon.xml',
              root / 'branding/rocha_plus_icon.png',
              root / 'receiver/index.html',
          ]
          for path in forbidden_paths:
              if path.exists():
                  raise SystemExit(f'Obsolete file returned: {path}')

          source_roots = [root / 'lib', root / 'android']
          source_files = []
          for source_root in source_roots:
              if source_root.exists():
                  source_files.extend(
                      path for path in source_root.rglob('*')
                      if path.is_file() and path.suffix in {'.dart', '.kt', '.kts', '.xml'}
                  )
          source_text = '\n'.join(
              path.read_text(errors='ignore') for path in source_files
          )
          forbidden_tokens = [
              'rocha_plus/screen_mirror',
              'ACTION_CAST_SETTINGS',
              'ACTION_WIRELESS_SETTINGS',
              'HlsVideoSegmentFormat.mpeg2Ts',
              'ROCHA_CAST_APP_ID',
          ]
          for token in forbidden_tokens:
              if token in source_text:
                  raise SystemExit(f'Obsolete or unsafe command found: {token}')

          player = (root / 'lib/src/screens/player_screen.dart').read_text()
          if 'state == CastMediaPlayerState.playing' not in player:
              raise SystemExit('Cast success no longer requires real PLAYING state.')
          if 'GoogleCastConnectState.connected' not in player:
              raise SystemExit('Cast session connection validation is missing.')

          webp = (root / 'branding/rocha_plus_icon.webp').read_bytes()
          if len(webp) < 1024 or webp[:4] != b'RIFF' or webp[8:12] != b'WEBP':
              raise SystemExit('Rocha+ branding WebP is invalid.')

          print(f'Preflight OK: single Rocha+ branding WebP {len(webp)} bytes.')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build optimized APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Play Store bundle
        run: flutter build appbundle --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-play-store
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
