name: Historical checkout provenance LAB (read-only)
on:
  push:
    branches: [lab/roku-visual-covers-performance-20261102]
    paths:
      - experiments/central-rights/checkout-audit.mjs
      - experiments/central-rights/checkout-audit.test.mjs
      - experiments/central-rights/run-checkout-audit.mjs
      - .github/workflows/checkout-origins-lab.yml
permissions:
  contents: read
jobs:
  checkout-read:
    if: github.repository == 'japarocha2-cloud/rocha-plus' && github.ref == 'refs/heads/lab/roku-visual-covers-performance-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: billing
      - run: node --input-type=module -e "import {runCheckoutAuditTests} from './experiments/central-rights/checkout-audit.test.mjs'; console.log(await runCheckoutAuditTests())"
      - name: Exact two payment origins, no checkout submission
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_RECEIVING_ACCESS_TOKEN: ${{ secrets.MP_RECEIVING_ACCESS_TOKEN }}
        run: node experiments/central-rights/run-checkout-audit.mjs
