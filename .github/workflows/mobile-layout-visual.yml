name: Mobile Layout Visual APK
on:
  push:
    branches:
      - feat/mobile-home-layout-20261014
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare Android scaffold
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
          import re
          s, n = re.subn(r'(applicationId\\s*=\\s*")[^"]+(")', r'\\g<1>com.rochaplus.layoutpreview\\g<2>', s, count=1)
          if n != 1:
              raise RuntimeError('applicationId not found')
          p.write_text(s)
          PY
      - name: Configure phone
        run: python3 tools/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build isolated visual APK
        run: flutter build apk --debug --dart-define=ROCHA_VISUAL_TEST=true
      - name: Publish visual APK
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-layout-visual-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
