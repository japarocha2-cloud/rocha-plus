name: Rocha+ Firebase Admin Credential Check

on:
  push:
    branches:
      - feat/spark-payment-confirmation-20261015
    paths:
      - '.github/workflows/firebase-admin-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firebase-admin-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Firebase Admin secret shape without reading Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node <<'NODE'
          const { createPrivateKey } = require('node:crypto');
          const fail = code => { console.log(JSON.stringify({ok:false,code,readOnly:true})); process.exitCode=1; };
          try {
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
            if (!raw) return fail('missing-firebase-admin-secret');
            const account = JSON.parse(raw);
            if (account.type !== 'service_account' ||
                account.project_id !== 'rocha-plus' ||
                typeof account.client_email !== 'string' ||
                !account.client_email.endsWith('@rocha-plus.iam.gserviceaccount.com') ||
                !account.private_key ||
                !account.client_id ||
                !account.token_uri?.startsWith('https://oauth2.googleapis.com/')) {
              return fail('invalid-firebase-admin-account');
            }
            createPrivateKey(account.private_key);
            console.log(JSON.stringify({ok:true,code:'firebase-admin-secret-format-verified',readOnly:true,project:'rocha-plus'}));
          } catch (_) {
            fail('firebase-admin-secret-invalid');
          }
          NODE
