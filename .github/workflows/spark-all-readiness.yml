name: Rocha+ Read-Only Payment Account Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spark-payment-confirmation-20261015
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install billing dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check payment safeguards
        working-directory: billing
        run: npm test
      - name: Review merchant plans and existing account readiness without writes
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          node billing/tools/reconcile-spark-payments.mjs \
            --project rocha-plus --all --collector 1981204845 \
            --monthly-plan 0b66f85cf2914aa88b9f1eadfa8b81a9 \
            --annual-plan bb0c2c90ff3d45a6a8203b69fbabf871
