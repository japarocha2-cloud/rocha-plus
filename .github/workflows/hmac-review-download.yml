name: HMAC review package download
on:
  push:
    branches: [impl/commercial-checkout-20261104]
    paths: ['.github/workflows/hmac-review-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-only:
    if: github.ref == 'refs/heads/impl/commercial-checkout-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore unchanged review ZIP and verify checksums only (no deploy)
        shell: python
        run: |
          import base64, hashlib, zipfile, json, io
          from pathlib import Path
          data = base64.b64decode('', validate=True)
          expected = '336db70fadc765ce0944f91a02166f17dad133980746c2e4b57f83898a44ef16'
          assert hashlib.sha256(data).hexdigest() == expected
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              config = json.loads(archive.read('firebase.webhook-hmac.homologacao.json'))
              assert config['functions'][0]['codebase'] == 'webhook-bootstrap-homologacao'
              for line in archive.read('SHA256SUMS').decode().splitlines():
                  checksum, name = line.split('  ', 1)
                  assert hashlib.sha256(archive.read(name)).hexdigest() == checksum
              Path('LEIA-ME-REVISAO.md').write_bytes(archive.read('README.md'))
          Path('RochaPlus-Webhook-HMAC-Revisao-Local.zip').write_bytes(data)
          Path('SHA256SUMS').write_text(expected + '  RochaPlus-Webhook-HMAC-Revisao-Local.zip\n')
          print('Unchanged review archive verified. No source applied, tests repeated, secrets, IAM, financial calls or deployment.')
      - uses: actions/upload-artifact@v4
        with:
          name: RochaPlus-Webhook-HMAC-Revisao-Local
          path: |
            RochaPlus-Webhook-HMAC-Revisao-Local.zip
            LEIA-ME-REVISAO.md
            SHA256SUMS
          if-no-files-found: error
