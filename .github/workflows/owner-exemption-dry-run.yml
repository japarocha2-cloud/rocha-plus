name: Rocha+ Owner Exemption Dry Run
on:
  push:
    branches:
      - feat/spark-payment-confirmation-20261015
    paths:
      - '.github/workflows/owner-exemption-dry-run.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install billing dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify owner access exemption without writes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node billing/tools/grant-owner-access.mjs --project rocha-plus
