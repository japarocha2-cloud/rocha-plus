name: Rocha+ ARM64 LAB APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocha-arm64-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed ARM64 LAB APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require the authorized LAB branch
        shell: bash
        run: |
          set -euo pipefail
          expected='refs/heads/lab/arm64-apk-isolated-20261111'
          if [[ "$GITHUB_REF" != "$expected" ]]; then
            echo "::error::This workflow is restricted to $expected. No build was started."
            exit 1
          fi

      - name: Checkout authorized LAB branch
        uses: actions/checkout@v4
        with:
          ref: lab/arm64-apk-isolated-20261111
          persist-credentials: false

      - name: Confirm checked out branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'lab/arm64-apk-isolated-20261111' || {
            echo '::error::Checkout did not resolve to the authorized LAB branch.'
            exit 1
          }

      - name: Require existing LAB signing secrets
        shell: bash
        env:
          LAB_KEYSTORE_BASE64: ${{ secrets.ROCHA_LAB_KEYSTORE_BASE64 }}
          LAB_KEYSTORE_PASSWORD: ${{ secrets.ROCHA_LAB_KEYSTORE_PASSWORD }}
          LAB_KEY_ALIAS: ${{ secrets.ROCHA_LAB_KEY_ALIAS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$LAB_KEYSTORE_BASE64" ]] || missing+=(ROCHA_LAB_KEYSTORE_BASE64)
          [[ -n "$LAB_KEYSTORE_PASSWORD" ]] || missing+=(ROCHA_LAB_KEYSTORE_PASSWORD)
          [[ -n "$LAB_KEY_ALIAS" ]] || missing+=(ROCHA_LAB_KEY_ALIAS)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secrets: %s.\n' "${missing[*]}"
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Generate temporary Android scaffold and LAB configuration
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --empty --no-pub .
          python3 tools/configure_android.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path('android/settings.gradle.kts')
          source = settings.read_text(encoding='utf-8')
          plugin = r'(id\("com\.android\.application"\)\s+version\s+")[^"]+(" apply false)'
          source, plugin_count = re.subn(plugin, r'\g<1>9.1.1\g<2>', source, count=1)
          if plugin_count != 1:
              raise SystemExit('Expected exactly one Android Gradle Plugin declaration')
          settings.write_text(source, encoding='utf-8')

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          source = wrapper.read_text(encoding='utf-8')
          source, wrapper_count = re.subn(
              r'(?m)^distributionUrl=.*$',
              r'distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip',
              source,
              count=1,
          )
          if wrapper_count != 1:
              raise SystemExit('Expected exactly one Gradle distribution URL')
          wrapper.write_text(source, encoding='utf-8')

          app_gradle = Path('android/app/build.gradle.kts')
          source = app_gradle.read_text(encoding='utf-8')
          source, sdk_count = re.subn(r'(?m)^\s*compileSdk\s*=.*$', '    compileSdk = 37', source, count=1)
          source, app_count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.rochaplus.app"', source, count=1)
          if sdk_count != 1 or app_count != 1:
              raise SystemExit('Could not set the expected Android compileSdk/applicationId')
          source, suffix_count = re.subn(r'applicationIdSuffix\s*=\s*"[^"]+"', 'applicationIdSuffix = ".lab"', source, count=1)
          if suffix_count == 0:
              source += '\nandroid { buildTypes { getByName("debug") { applicationIdSuffix = ".lab" } } }\n'
          app_gradle.write_text(source, encoding='utf-8')
          PY

      - name: Confirm LAB Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'id("com.android.application") version "9.1.1"' android/settings.gradle.kts || {
            echo '::error::Expected LAB Android Gradle Plugin 9.1.1.'
            exit 1
          }
          grep -Fq 'gradle-9.3.1-all.zip' android/gradle/wrapper/gradle-wrapper.properties || {
            echo '::error::Expected Gradle wrapper 9.3.1.'
            exit 1
          }
          grep -Fq 'compileSdk = 37' android/app/build.gradle.kts || {
            echo '::error::Expected Android compileSdk 37.'
            exit 1
          }
          grep -Fq 'applicationId = "com.rochaplus.app"' android/app/build.gradle.kts || {
            echo '::error::Unexpected base applicationId.'
            exit 1
          }
          grep -Fq 'applicationIdSuffix = ".lab"' android/app/build.gradle.kts || {
            echo '::error::LAB applicationId suffix is missing.'
            exit 1
          }

      - name: Ensure Android API 37.0 build packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo '::error::Android SDK root is not configured on the runner.'
            exit 1
          fi
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" ]]; then
            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [[ ! -x "$sdkmanager" ]]; then
            echo '::error::Android sdkmanager is unavailable on the runner.'
            exit 1
          fi
          [[ -f "$sdk_root/platforms/android-37.0/android.jar" ]] || \
            "$sdkmanager" --sdk_root="$sdk_root" 'platforms;android-37.0'
          [[ -x "$sdk_root/build-tools/36.0.0/aapt" ]] || \
            "$sdkmanager" --sdk_root="$sdk_root" 'build-tools;36.0.0'
          [[ -d "$sdk_root/ndk/28.2.13676358" ]] || \
            "$sdkmanager" --sdk_root="$sdk_root" 'ndk;28.2.13676358'

      - name: Resolve Flutter dependencies in the disposable runner
        run: flutter pub get

      - name: Configure the existing LAB signer
        shell: bash
        env:
          LAB_KEYSTORE_BASE64: ${{ secrets.ROCHA_LAB_KEYSTORE_BASE64 }}
          LAB_KEYSTORE_PASSWORD: ${{ secrets.ROCHA_LAB_KEYSTORE_PASSWORD }}
          LAB_KEY_ALIAS: ${{ secrets.ROCHA_LAB_KEY_ALIAS }}
          GITHUB_REF_NAME: lab/arm64-apk-isolated-20261111
        run: |
          set -euo pipefail
          python3 tools/lab/configure_stable_signing.py
          grep -q 'create("rochaLabSigning")' android/app/build.gradle.kts || {
            echo '::error::Dedicated LAB signer was not configured.'
            exit 1
          }
          grep -q 'signingConfig = signingConfigs.getByName("rochaLabSigning")' android/app/build.gradle.kts || {
            echo '::error::Debug variant is not bound to the dedicated LAB signer.'
            exit 1
          }

      - name: Build the ARM64 debug LAB APK
        run: flutter build apk --debug --target-platform android-arm64 --no-pub

      - name: Verify APK package, ABI, and LAB certificate
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-debug.apk'
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo '::error::Android SDK root is not configured on the runner.'
            exit 1
          fi
          aapt="$sdk_root/build-tools/36.0.0/aapt"
          apksigner="$sdk_root/build-tools/36.0.0/apksigner"
          evidence='build/qa/arm64-lab-apk-evidence.md'
          expected_cert='1d206944cc0f2d14c280fc16e66aad0677f0847589b726e8d0ec549b5aff9cc7'
          test -s "$apk" || { echo '::error::Expected LAB APK was not generated.'; exit 1; }
          test -x "$aapt" || { echo '::error::Android aapt is unavailable.'; exit 1; }
          test -x "$apksigner" || { echo '::error::Android apksigner is unavailable.'; exit 1; }

          badging="$("$aapt" dump badging "$apk")"
          package_line="$(printf '%s\n' "$badging" | head -n 1)"
          [[ "$package_line" == *"name='com.rochaplus.app.lab'"* ]] || {
            echo '::error::APK applicationId is not com.rochaplus.app.lab.'
            exit 1
          }

          python3 - "$apk" <<'PY'
          import sys
          import zipfile

          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              abis = sorted({
                  name.split('/')[1]
                  for name in archive.namelist()
                  if name.startswith('lib/') and len(name.split('/')) > 2
              })
          if abis != ['arm64-v8a']:
              raise SystemExit(f'::error::APK ABI set must be only arm64-v8a; found: {abis}')
          print('ABI=arm64-v8a')
          PY

          cert_report="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)" || {
            printf '%s\n' "$cert_report"
            echo '::error::APK signature verification failed.'
            exit 1
          }
          cert_sha="$(printf '%s\n' "$cert_report" | awk -F': ' '/certificate SHA-256 digest:/ {print tolower($2); exit}')"
          [[ "$cert_sha" == "$expected_cert" ]] || {
            echo '::error::APK signer does not match the recorded LAB certificate.'
            exit 1
          }

          mkdir -p build/qa
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          version_line="$(printf '%s\n' "$package_line" | sed -E "s/^package: name='[^']+' versionCode='([^']+)' versionName='([^']+)'.*/versionCode=\1 versionName=\2/")"
          {
            echo '# Rocha+ ARM64 LAB APK evidence'
            echo "Branch: $GITHUB_REF_NAME"
            echo "Application ID: com.rochaplus.app.lab"
            echo "${version_line}"
            echo 'ABI: arm64-v8a'
            echo "Certificate SHA-256: ${cert_sha}"
            echo "APK SHA-256: ${apk_sha}"
            echo "APK path: ${apk}"
          } > "$evidence"
          printf '%s\n' "$cert_report"
          cat "$evidence"

      - name: Upload signed ARM64 LAB APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-arm64-lab-apk-${{ github.run_id }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/qa/arm64-lab-apk-evidence.md
          if-no-files-found: error
          retention-days: 7
