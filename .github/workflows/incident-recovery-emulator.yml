name: Incident recovery Firestore emulator integration
on:
  push:
    branches: [incident/payment-recognition-20261103]
    paths: [.github/workflows/incident-recovery-emulator.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9f0fe427bbb6974d0cac1e26c6274369b1cb3cb4
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/entitlement
      - name: Reuse existing deny rules inside emulator project
        run: cp backend/entitlement/firestore.rules backend/entitlement/emulator/firestore.rules
      - name: Real SDK contention and transaction rollback with fixture data only
        env:
          GCLOUD_PROJECT: demo-rocha-recovery
        run: npx --yes firebase-tools@latest emulators:exec --only firestore --project demo-rocha-recovery --config backend/entitlement/emulator/firebase.json 'node backend/entitlement/emulator/recovery.integration.mjs'
