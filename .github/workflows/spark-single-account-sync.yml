name: Rocha+ Single Account Sync (preview by default)
on:
  # Manual only: editing this file on main must not run production access.
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write verified payment state for the fixed pilot account'
        type: boolean
        default: false
      target_uid:
        description: 'Exact Firebase UID (required only for apply)'
        type: string
        default: ''
      confirm_uid:
        description: 'Repeat the same UID (required only for apply)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: rocha-spark-single-account-sync
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'japarocha2-cloud/rocha-plus'
    # Production writes wait for a required reviewer configured in
    # Settings > Environments > producao-contas-escrita (see docs/lab).
    environment: producao-contas-escrita
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate operator input before any production access
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
          TARGET_UID: ${{ inputs.target_uid }}
          CONFIRM_UID: ${{ inputs.confirm_uid }}
        run: |
          if [ "$APPLY" = 'true' ]; then
            uid_re='^[a-zA-Z0-9_-]{1,128}$'
            if [[ ! "$TARGET_UID" =~ $uid_re || ! "$CONFIRM_UID" =~ $uid_re ]]; then
              echo 'Invalid Firebase UID format'
              exit 1
            fi
            if [ "$TARGET_UID" != "$CONFIRM_UID" ]; then
              echo 'target_uid and confirm_uid differ'
              exit 1
            fi
          fi
      - uses: actions/checkout@v4
        with:
          ref: 86bdabe25cf53f74d59c1061d95e500ee9fb4f6b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test payment safeguards before accessing production
        working-directory: billing
        run: npm test
      - name: Check for subscriptions without writes
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node billing/tools/audit-test-subscriber.mjs
      - name: Preview or reconcile the fixed pilot account
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
          TARGET_UID: ${{ inputs.target_uid }}
          CONFIRM_UID: ${{ inputs.confirm_uid }}
        run: |
          args=()
          if [ "$APPLY" = 'true' ]; then
            args+=(--apply --uid "$TARGET_UID" --confirm-uid "$CONFIRM_UID")
          fi
          node billing/tools/reconcile-test-subscriber.mjs "${args[@]}"

