name: Rocha+ Single Account Sync (preview by default)
on:
  push:
    branches: [feat/spark-payment-confirmation-20261015]
    paths:
      - '.github/workflows/spark-single-account-sync.yml'
      - 'billing/read_only_firestore*'
      - 'billing/tools/reconcile-test-subscriber.mjs'
      - 'billing/tools/reconcile-spark-payments.mjs'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write verified payment state for the fixed pilot account'
        type: boolean
        default: false
      target_uid:
        description: 'Exact Firebase UID (required only for apply)'
        type: string
        default: ''
      confirm_uid:
        description: 'Repeat the same UID (required only for apply)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: rocha-spark-single-account-sync
  cancel-in-progress: false
jobs:
  pilot:
    if: github.repository == 'japarocha2-cloud/rocha-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test payment safeguards before accessing production
        working-directory: billing
        run: npm test
      - name: Preview or reconcile the fixed pilot account
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && 'true' || 'false' }}
          TARGET_UID: ${{ inputs.target_uid }}
          CONFIRM_UID: ${{ inputs.confirm_uid }}
        run: |
          args=()
          if [ "$APPLY" = 'true' ]; then
            args+=(--apply --uid "$TARGET_UID" --confirm-uid "$CONFIRM_UID")
          fi
          node billing/tools/reconcile-test-subscriber.mjs "${args[@]}"
