name: Category Cover Fit Checks
on:
  push:
    branches: [fix/mobile-category-cover-fit-20261015]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - name: Verify existing category and carousel layout tests
        run: flutter test test/mobile_category_layout_test.dart test/home_featured_carousel_test.dart test/mobile_category_assets_test.dart
