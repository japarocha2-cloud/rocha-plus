name: Rocha+ Apply Owner Exemption (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter APPLY-OWNER-EXEMPTION to grant the verified owner account access'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rocha-owner-exemption
  cancel-in-progress: false

jobs:
  owner-grant:
    if: github.repository == 'japarocha2-cloud/rocha-plus' && github.ref == 'refs/heads/feat/spark-payment-confirmation-20261015' && inputs.confirmation == 'APPLY-OWNER-EXEMPTION'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate owner exemption safeguards
        working-directory: billing
        run: node --test owner_access_safety.test.js
      - name: Grant verified owner access only
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node billing/tools/grant-owner-access.mjs --project rocha-plus --apply
