name: Incident monthly-only preparation fixtures
on:
  push:
    branches: [incident/payment-recognition-20261103]
    paths:
      - backend/entitlement/monthly_only_preparation*
      - backend/entitlement/recovery_changeset_preview.mjs
      - .github/workflows/incident-monthly-only.yml
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --input-type=module -e "import {runMonthlyOnlyTests} from './backend/entitlement/monthly_only_preparation.test.mjs'; console.log(await runMonthlyOnlyTests())"
      - run: node --test backend/entitlement/recovery_changeset_preview.test.mjs
