name: Rocha+ Commercial Subscription Plans (read-only)

on:
  push:
    branches:
      - feat/spark-payment-confirmation-20261015
    paths:
      - '.github/workflows/commercial-plan-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List verified merchant commercial plans (no changes)
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          (async () => {
            const token = process.env.MP_ACCESS_TOKEN?.trim();
            if (!token || /\s/.test(token)) throw Error('production-secret-unavailable');
            const headers = {Authorization: 'Bearer ' + token, Accept: 'application/json'};
            const opts = {headers, redirect:'error',signal:AbortSignal.timeout(20000)};
            const me = await fetch('https://api.mercadopago.com/users/me',opts);
            if (!me.ok) throw Error('merchant-authentication-failed:' + me.status);
            const merchant = await me.json();
            if (String(merchant.id)!=='1981204845' || merchant.site_id!=='MLB' || merchant.tags?.includes('test_user')) {
              throw Error('incorrect-production-merchant');
            }
            let offset = 0, count = 0, matched = [];
            while (offset < 200) {
              const url = new URL('https://api.mercadopago.com/preapproval_plan/search');
              url.searchParams.set('limit','100');
              url.searchParams.set('offset',String(offset));
              const response = await fetch(url,opts);
              if (!response.ok) throw Error('plan-search-failed:' + response.status);
              const data=await response.json();
              const page=Array.isArray(data.results)?data.results:[];
              for(const p of page) {
                if(String(p.collector_id)!=='1981204845') continue;
                const a=p.auto_recurring||{};
                if ((a.frequency_type==='months' && [1,12].includes(Number(a.frequency))) || (a.frequency_type==='years' && Number(a.frequency)===1)) {
                  matched.push({id:p.id,periodMonths:a.frequency_type==='years'?12:Number(a.frequency),periodUnit:a.frequency_type,amount:a.transaction_amount,currency:a.currency_id,status:p.status,description:p.reason});
                }
              }
              count+=page.length;offset+=page.length;
              if(page.length===0 || offset>=Number(data.paging?.total||0)) break;
            }
            console.log(JSON.stringify({ok:true,readOnly:true,merchantVerified:true,scanned:count,commercialCandidates:matched}));
            if(offset>=200) console.log('WARNING: pagination capped at 200; audit may be incomplete');
          })().catch(e=>{console.log(JSON.stringify({ok:false,readOnly:true,code:e.message}));process.exitCode=1});
          NODE
