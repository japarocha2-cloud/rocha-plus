name: Bootstrap package download
on:
  push:
    branches: [impl/commercial-checkout-20261104]
    paths: ['.github/workflows/bootstrap-download.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-only:
    if: github.ref == 'refs/heads/impl/commercial-checkout-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore reviewed public package and verify integrity (no deploy)
        shell: python
        run: |
          import base64, hashlib, zipfile, json, io
          from pathlib import Path
          data = base64.b64decode('', validate=True)
          expected = '1f081d8db05ff851bfbb88d7a8f13f96a5d9e27d2f9f5f0cf8f8ff2c33c3e605'
          assert hashlib.sha256(data).hexdigest() == expected
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              config = json.loads(archive.read('firebase.webhook-bootstrap.homologacao.json'))
              assert config['functions'][0]['codebase'] == 'webhook-bootstrap-homologacao'
              Path('Preparar-Bootstrap-SEM-DEPLOY.txt').write_bytes(archive.read('Preparar-Bootstrap-SEM-DEPLOY.txt'))
          Path('RochaPlus-Webhook-Bootstrap-Preparacao.zip').write_bytes(data)
          Path('SHA256SUMS').write_text(expected + '  RochaPlus-Webhook-Bootstrap-Preparacao.zip\n')
          print('Reviewed package verified. No cloud credentials, deploy, IAM, secrets or financial APIs.')
      - uses: actions/upload-artifact@v4
        with:
          name: RochaPlus-Webhook-Bootstrap-Preparacao
          path: |
            RochaPlus-Webhook-Bootstrap-Preparacao.zip
            Preparar-Bootstrap-SEM-DEPLOY.txt
            SHA256SUMS
          if-no-files-found: error
