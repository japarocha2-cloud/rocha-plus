name: Billing backend tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Policy and HTTP service tests with mocked Publisher
        run: node --test backend/policy.test.js backend/service.test.js
      - name: Install backend and emulator dependencies
        run: npm install --prefix backend --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --prefix backend --omit=dev --audit-level=high
      - name: Record full dependency audit
        if: always()
        working-directory: backend
        run: npm audit --json > dependency-audit.json || true
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: billing-dependency-evidence
          path: |
            backend/package-lock.json
            backend/dependency-audit.json
      - name: Check actual Firebase exports without deployment
        env:
          GCLOUD_PROJECT: demo-rocha-billing
        run: node --input-type=module -e "const m = await import('./backend/index.js'); if (!m.billing || !m.billingNotifications) process.exit(1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore transactions and private security rules in demo emulator
        working-directory: backend
        run: npx --no-install firebase emulators:exec --only firestore --project demo-rocha-billing --config firebase.test.json "node --test firestore.test.js"
