name: TV Morena signed login test APK
on:
  push:
    branches:
      - test/tv-morena-source-review-20261017
    paths:
      - '.github/workflows/tv-morena-test-apk.yml'
      - 'catalog/approved.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ROCHA_KEYSTORE_PASSWORD: ${{ secrets.ROCHA_KEYSTORE_PASSWORD }}
      ROCHA_KEY_ALIAS: ${{ secrets.ROCHA_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare Android app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 tools/configure_android.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37')
          p.write_text(s)
          PY
      - name: Prepare existing signed Firebase login
        env:
          ROCHA_KEYSTORE_BASE64: ${{ secrets.ROCHA_KEYSTORE_BASE64 }}
          ROCHA_FIREBASE_CONFIG_JSON: ${{ secrets.ROCHA_FIREBASE_CONFIG_JSON }}
        run: python3 tools/prepare_signed_build.py
      - name: Install dependencies
        run: flutter pub get
      - name: Verify TV Morena is only in test catalog
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('catalog/approved.json'))
          items=[x for x in data if x['name'].startswith('TV Morena')]
          assert len(items)==3, f'Expected 3 TV Morena entries, got {len(items)}'
          assert all(x.get('experimental') and x.get('release_scope')=='owner_testing_only' for x in items)
          print('TV Morena candidates:', len(items))
          PY
      - name: Build signed release with real Firebase login
        env:
          ROCHA_BILLING_API_URL: ${{ vars.ROCHA_BILLING_API_URL }}
        run: flutter build apk --release --dart-define-from-file="$ROCHA_FIREBASE_FILE" --dart-define="ROCHA_BILLING_API_URL=$ROCHA_BILLING_API_URL" --build-number=5000
      - name: Upload signed TV Morena test APK
        uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-tv-morena-test-signed
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
