name: Rocha+ Payment Verification Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'billing/**'
      - '.github/workflows/payment-verification.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'billing/**'
      - '.github/workflows/payment-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run server-side payment verification tests
        run: node --test backend/*.test.js
      - name: Install billing dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify recurring billing and administrative Spark confirmation
        working-directory: billing
        run: npm test
