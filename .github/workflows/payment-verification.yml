name: Rocha+ Payment Verification Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'billing/**'
      - '.github/workflows/payment-verification.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'billing/**'
      - '.github/workflows/payment-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run server-side payment verification tests
        run: node --test backend/*.test.js
      - name: Install billing dependencies
        working-directory: billing
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify recurring billing and administrative Spark confirmation
        working-directory: billing
        run: npm test

  sandbox-credentials:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/spark-payment-confirmation-20261015' && github.repository == 'japarocha2-cloud/rocha-plus'
    concurrency:
      group: rocha-mercadopago-sandbox-plan
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Authenticate only the configured Mercado Pago test seller (read-only)
        env:
          MP_TEST_ACCESS_TOKEN: ${{ secrets.MP_TEST_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_SELLER_ID: '3717765439'
        run: node backend/mercadopago_sandbox_check.js
      - name: Prepare or reuse the isolated sandbox monthly checkout
        env:
          MP_TEST_ACCESS_TOKEN: ${{ secrets.MP_TEST_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_SELLER_ID: '3717765439'
        run: node backend/mercadopago_sandbox_checkout.js
