name: Live Payment Pilot Readiness (read-only)
on:
  push:
    branches: [test/live-payment-pilot-20261015]
    paths: ['.github/workflows/live-payment-readiness.yml']
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 86bdabe25cf53f74d59c1061d95e500ee9fb4f6b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: billing
      - name: Read current subscriber state without writes
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node billing/tools/audit-test-subscriber.mjs
      - name: Verify merchant and plans and preview access projection without writes
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node billing/tools/reconcile-test-subscriber.mjs
      - name: Inspect only official monthly checkout redirects (no payment)
        run: |
          node --input-type=module <<'NODE'
          let target = new URL('https://mpago.la/2E7yjF4');
          let hops = 0;
          while (hops++ < 6) {
            if (target.protocol !== 'https:' ||
                !['mpago.la','mercadopago.com','www.mercadopago.com','mercadopago.com.br','www.mercadopago.com.br'].includes(target.hostname)) {
              throw Error('unexpected-checkout-destination');
            }
            const response = await fetch(target, {redirect:'manual',signal:AbortSignal.timeout(20000)});
            const location = response.headers.get('location');
            if (response.status >= 300 && response.status < 400 && location) {
              target = new URL(location, target);
              await response.body?.cancel();
              continue;
            }
            await response.body?.cancel();
            console.log(JSON.stringify({readOnly:true,host:target.hostname,
              subscriptionCheckout:target.pathname.includes('subscriptions'),
              paymentCheckout:target.pathname.includes('checkout/v1'),
              matchesMonthlyPlan:target.searchParams.get('preapproval_plan_id')==='0b66f85cf2914aa88b9f1eadfa8b81a9',
              responseStatus:response.status}));
            break;
          }
          NODE

      - name: Inspect official monthly plan checkout and permitted payment methods (read-only)
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.mercadopago.com/preapproval_plan/search?limit=100&offset=0',
            {headers:{Authorization:'Bearer '+process.env.MP_ACCESS_TOKEN,Accept:'application/json'},
             redirect:'error',signal:AbortSignal.timeout(20000)});
          if(!response.ok) throw Error('plan-search-not-confirmed');
          const page=await response.json();
          const matches=page.results?.filter(p=>p.id==='0b66f85cf2914aa88b9f1eadfa8b81a9');
          if(matches?.length!==1 || String(matches[0].collector_id)!=='1981204845') throw Error('plan-not-confirmed');
          const plan=matches[0];
          let checkout=null;
          if(plan.init_point) {
            const url=new URL(plan.init_point);
            if(url.protocol==='https:' &&
               ['www.mercadopago.com.br','mercadopago.com.br'].includes(url.hostname) &&
               url.searchParams.get('preapproval_plan_id')===plan.id) checkout=url.href;
          }
          const a=plan.auto_recurring||{};
          console.log(JSON.stringify({readOnly:true,status:plan.status,
            amount:a.transaction_amount,currency:a.currency_id,frequency:a.frequency,
            frequencyType:a.frequency_type,freeTrial:a.free_trial??null,
            paymentMethodsAllowed:plan.payment_methods_allowed??null,
            officialMonthlyCheckout:checkout}));
          NODE

      - name: Inspect recent pilot payment results without exposing payment or card IDs
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          try {
            const url=new URL('https://api.mercadopago.com/v1/payments/search');
            for(const [key,value] of Object.entries({sort:'date_created',criteria:'desc',
              range:'date_created',begin_date:'NOW-1HOURS',end_date:'NOW',limit:'50',offset:'0',
              'collector.id':'1981204845'})) url.searchParams.set(key,value);
            const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.MP_ACCESS_TOKEN,Accept:'application/json'},
              redirect:'error',signal:AbortSignal.timeout(20000)});
            if(!response.ok) throw Error('payment-search-unavailable');
            const page=await response.json();
            if(!Array.isArray(page.results)) throw Error('invalid-result');
            const matched=page.results.filter(p=>
              String(p.collector_id)==='1981204845' &&
              p.payer?.email?.trim().toLowerCase()==='andressarocha9706@gmail.com' &&
              Number(p.transaction_amount)===4.9 && p.currency_id==='BRL');
            console.log(JSON.stringify({readOnly:true,window:'last-hour',
              complete:Number(page.paging?.total??Infinity)<=50,pilotPaymentCount:matched.length,
              payments:matched.map(p=>({status:p.status,statusDetail:p.status_detail,
                amount:p.transaction_amount,currency:p.currency_id,liveMode:p.live_mode,
                createdAt:p.date_created,titleMatchesMonthlyPlan:
                String(p.description??'').toLowerCase().includes('rocha')}))}));
          } catch (_) {
            console.log(JSON.stringify({readOnly:true,code:'pilot-payment-results-not-confirmed'}));
            process.exitCode=1;
          }
          NODE

      - name: Resolve pilot rejection by verified subscriber payer ID and invoice chain (read-only)
        working-directory: billing
        env:
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {createProvider} from './provider.js';
          import {checkedSubscription} from './recurring.js';
          try {
            const config={collectorId:'1981204845',liveMode:true,now:Date.now(),planIds:{
              monthly:'0b66f85cf2914aa88b9f1eadfa8b81a9',annual:'bb0c2c90ff3d45a6a8203b69fbabf871'}};
            const provider=createProvider({accessToken:process.env.MP_ACCESS_TOKEN,webhookSecret:''});
            const subscriptions=await provider.subscriptions('andressarocha9706@gmail.com',config.planIds);
            if(subscriptions.length>10) throw Error('scope-limit');
            const payers=new Set(),invoiceResults=[];
            for(const item of subscriptions) {
              const s=checkedSubscription(item,config);
              if(s.email!=='andressarocha9706@gmail.com') throw Error('identity-mismatch');
              payers.add(s.payerId);
              for(const invoice of await provider.invoices(s.id)) {
                if(String(invoice.preapproval_id)!==s.id) throw Error('invoice-owner');
                const id=invoice.payment?.id;
                if(id) {
                  const p=await provider.payment(id);
                  if(String(p.collector_id)!==config.collectorId || String(p.payer?.id)!==s.payerId) throw Error('payment-owner');
                  invoiceResults.push({status:p.status,statusDetail:p.status_detail,
                    amount:p.transaction_amount,currency:p.currency_id,createdAt:p.date_created});
                }
              }
            }
            const found=new Map();let complete=true;
            for(const payer of payers) {
              const url=new URL('https://api.mercadopago.com/v1/payments/search');
              for(const [key,value] of Object.entries({sort:'date_created',criteria:'desc',
                range:'date_created',begin_date:'NOW-2HOURS',end_date:'NOW',limit:'50',offset:'0',
                'collector.id':config.collectorId,'payer.id':payer})) url.searchParams.set(key,value);
              const response=await fetch(url,{headers:{Authorization:'Bearer '+process.env.MP_ACCESS_TOKEN,Accept:'application/json'},
                redirect:'error',signal:AbortSignal.timeout(20000)});
              if(!response.ok) throw Error('payment-search-unavailable');
              const page=await response.json();
              if(!Array.isArray(page.results)) throw Error('invalid-result');
              complete=complete&&Number(page.paging?.total??Infinity)<=50;
              for(const p of page.results) {
                if(String(p.collector_id)===config.collectorId && String(p.payer?.id)===payer &&
                   Number(p.transaction_amount)===4.9 && p.currency_id==='BRL')
                  found.set(String(p.id),{status:p.status,statusDetail:p.status_detail,
                    amount:p.transaction_amount,currency:p.currency_id,createdAt:p.date_created,
                    titleMatchesMonthlyPlan:String(p.description??'').toLowerCase().includes('rocha')});
              }
            }
            console.log(JSON.stringify({readOnly:true,verifiedSubscriptions:subscriptions.length,
              complete,payerMatchedPayments:[...found.values()],invoicePayments:invoiceResults}));
          } catch (_) {
            console.log(JSON.stringify({readOnly:true,code:'pilot-rejection-details-not-confirmed'}));
            process.exitCode=1;
          }
          NODE
