name: Cast Live Continuity Candidate
on:
  push:
    branches: [fix/cast-live-continuity-20261016]
    paths: ['lib/**', 'test/**', 'tools/**', '.github/workflows/cast-live-candidate.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/src/cast/live_cast_loader.dart lib/src/cast/cast_live_recovery.dart lib/src/cast/cast_playback_evidence.dart lib/src/screens/player_screen.dart lib/src/screens/cast_control_screen.dart test/cast_live_recovery_test.dart test/live_cast_loader_test.dart test/cast_playback_evidence_test.dart test/cast_disconnect_resume_test.dart
      - name: Cast continuity and access regression tests
        run: |
          set -o pipefail
          mkdir -p build/cast-live-evidence
          flutter test --reporter expanded test/cast_live_recovery_test.dart test/live_cast_loader_test.dart test/cast_playback_evidence_test.dart test/cast_disconnect_resume_test.dart test/cast_continuity_audit_test.dart test/cast_hls_continuity_audit_test.dart test/cast_hls_proxy_test.dart test/cast_readiness_test.dart test/cast_device_picker_test.dart test/playback_evidence_test.dart test/access_flow_regression_test.dart test/roku_pairing_test.dart | tee build/cast-live-evidence/tests.txt
      - run: node --test billing/pairing/service.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-live-test-evidence
          path: build/cast-live-evidence/
  signed-android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROCHA_SPARK_TRIAL: 'true'
      ROCHA_BILLING_API_URL: ${{ vars.ROCHA_BILLING_API_URL }}
      ROCHA_ROKU_PAIRING_ENDPOINT: ${{ vars.ROCHA_ROKU_PAIRING_ENDPOINT }}
      ROCHA_KEYSTORE_PASSWORD: ${{ secrets.ROCHA_KEYSTORE_PASSWORD }}
      ROCHA_KEY_ALIAS: ${{ secrets.ROCHA_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37'))
          PY
          python3 tools/configure_android.py
      - run: python3 -m unittest discover -s tools -p 'test_configure_android.py'
      - name: Prepare existing private signing and Firebase configuration
        env:
          ROCHA_KEYSTORE_BASE64: ${{ secrets.ROCHA_KEYSTORE_BASE64 }}
          ROCHA_FIREBASE_CONFIG_JSON: ${{ secrets.ROCHA_FIREBASE_CONFIG_JSON }}
        run: python3 tools/prepare_signed_build.py
      - run: flutter pub get
      - name: Compare full test suites with pinned frozen baseline
        run: python3 tools/verify_access_regressions.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast-live-full-regression-evidence
          path: build/access-flow-evidence.json
          if-no-files-found: warn
      - name: Build isolated signed candidate 4301
        run: |
          flutter build apk --release \
            --build-number=4301 --build-name=0.1.0-cast4301 \
            --dart-define="ROCHA_SPARK_TRIAL=$ROCHA_SPARK_TRIAL" \
            --dart-define="ROCHA_BILLING_API_URL=$ROCHA_BILLING_API_URL" \
            --dart-define="ROCHA_ROKU_PAIRING_ENDPOINT=$ROCHA_ROKU_PAIRING_ENDPOINT" \
            --dart-define-from-file="$ROCHA_FIREBASE_FILE"
      - name: Verify APK package and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/rocha-badging.txt
          grep "^package:" /tmp/rocha-badging.txt
          grep -q "name='com.rochaplus.app' versionCode='4301'" /tmp/rocha-badging.txt
          "$SIGNER" verify --verbose --print-certs "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-cast-live-4301-candidate
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Remove private signing files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rocha-private"
