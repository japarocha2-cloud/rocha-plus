name: Roku LAB 0.6.10 package

on:
  push:
    branches: [lab/roku-0.6.10-google-activation-admin-20261103]
    paths:
      - 'platforms/roku-lab-visual/**'
      - 'experiments/roku-0610/**'
      - 'tools/roku_visual_lab.mjs'
      - '.github/workflows/roku-0610-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend fixtures
        run: node --input-type=module -e "import {runActivationTests} from './experiments/roku-0610/activation.test.mjs'; const r=await runActivationTests(); console.log(JSON.stringify(r)); if(r.failed||r.passed!==12) process.exit(1)"
      - name: Build and validate sideload ZIP
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {build,readZip} from './tools/roku_visual_lab.mjs';
          const target='/tmp/RochaPlus-Roku-LAB-0.6.10-ACESSO-DESATIVADO-REV2.zip';
          const built=await build('platforms/roku-lab-visual',target,{excludeProvisionalCovers:true,onlyMappedLogoFiles:true});
          const files=readZip(await fs.readFile(target));
          const count=x=>Array.isArray(x)?x.length:Object.keys(x).length;
          assert.equal(Object.keys(files).length,574);
          assert.match(files.manifest.toString(),/build_version=10/);
          assert.equal(count(JSON.parse(files['catalog/commercial-lab-merged.json'])),607);
          assert.equal(count(JSON.parse(files['config/cover-map.json'])),578);
          for(const p of ['config/auth.json','config/central-access.json','config/lab-access.json']) assert.equal(JSON.parse(files[p]).enabled,false,p);
          const text=Object.entries(files).filter(([n])=>/\.(json|brs|xml|html|txt)$/i.test(n)).map(([,b])=>b.toString()).join('\n');
          assert(!text.includes('example.invalid'));
          assert(!text.includes('fixture-scenario.json'));
          assert(!/AIza[0-9A-Za-z_-]{35}|-----BEGIN (?:RSA |EC )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}/.test(text));
          console.log(JSON.stringify({...built,catalog:607,coverAssociations:578,integrationsEnabled:false,secretsDetected:0}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: RochaPlus-Roku-LAB-0.6.10-ACESSO-DESATIVADO-REV2
          path: /tmp/RochaPlus-Roku-LAB-0.6.10-ACESSO-DESATIVADO-REV2.zip
          if-no-files-found: error
          retention-days: 30
