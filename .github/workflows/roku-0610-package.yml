name: Roku LAB 0.6.10 REV4 full catalog physical review

on:
  push:
    branches: [lab/roku-0.6.10-google-activation-admin-20261103]
    paths:
      - 'platforms/roku-lab-visual/**'
      - 'experiments/roku-0610/**'
      - 'tools/roku_visual_lab.mjs'
      - '.github/workflows/roku-0610-package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend fixtures
        run: node --input-type=module -e "import {runActivationTests} from './experiments/roku-0610/activation.test.mjs'; const r=await runActivationTests(); console.log(JSON.stringify(r)); if(r.failed||r.passed!==12) process.exit(1)"
      - name: Build and validate sideload ZIP
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {build,readZip} from './tools/roku_visual_lab.mjs';
          const target='/tmp/RochaPlus-Roku-LAB-0.6.10-REV4-CATALOGO-607-PLAYBACK-BLOQUEADO.zip';
          const built=await build('platforms/roku-lab-visual',target,{excludeProvisionalCovers:true,onlyMappedLogoFiles:true});
          const files=readZip(await fs.readFile(target));
          const count=x=>Array.isArray(x)?x.length:Object.keys(x).length;
          assert.equal(Object.keys(files).length,574);
          assert.match(files.manifest.toString(),/build_version=10/);
          const catalog=JSON.parse(files['catalog/commercial-lab-merged.json']);
          assert.equal(count(catalog),607);
          assert.equal(new Set(catalog.map(x=>x.id)).size,607,'unique catalog IDs');
          assert.equal(catalog.filter(x=>(x.url.startsWith('https://')||x.url.startsWith('http://'))&&x.url.toLowerCase().includes('.m3u8')&&x.blocked!==true&&x.quarantined!==true).length,607,'all records navigable');
          const evaluator=files['components/HomeScene.brs'].toString();
          assert(evaluator.includes('APROVAR (PADRÃO)')&&evaluator.includes('REPROVAR')&&evaluator.includes('ROCHAPLUS_PHYSICAL_REVIEW_CSV_BEGIN'));
          const blockedList=(await fs.readFile('docs/roku/physical-package-rev4-20261103/blocked-playback-channels.csv','utf8')).trim().split(/\r?\n/);
          assert.equal(blockedList.length,608,'header plus all blocked catalog records');
          for(const field of ['image','audio','freezes','remote','authorizationEvidence']) assert(evaluator.includes(field),'missing evaluation field '+field);
          assert(evaluator.includes('> SIM, REMOVER')&&evaluator.includes('CANCELAR'),'remove action needs confirmation');
          assert(evaluator.includes('and (m.showRemoved or not isRemoved(c.id))'),'removed records must be reversible');
          const browser=files['components/ChannelBrowser.brs'].toString();
          assert(browser.includes('AUTORIZAÇÃO PENDENTE'));
          assert.equal(count(JSON.parse(files['config/cover-map.json'])),578);
          for(const p of ['config/auth.json','config/central-access.json','config/lab-access.json']) assert.equal(JSON.parse(files[p]).enabled,false,p);
          const visual=JSON.parse(files['config/physical-lab-access.json']);
          assert.equal(visual.mode,'visual_only');
          assert.equal(visual.playbackEnabled,false);
          assert.deepEqual(visual.channelAllowlist,[]);
          const account=files['components/Account.brs'].toString();
          const player=files['components/ChannelBrowser.brs'].toString();
          const home=files['components/HomeScene.brs'].toString();
          assert(account.includes('function activateVisualOnlyLabAccess()'));
          assert(account.includes('if m.visualLabOnly = true then return true'));
          assert(home.includes('if m.visualLabOnly = true then return'));
          for(const marker of ['sub queuePreview()','sub onPreviewDebounce()','sub startPlayback()']) {
            const i=player.indexOf(marker); assert(i>=0,marker);
            assert(player.slice(i,i+800).includes('if m.visualLabOnly = true'),'missing playback deny: '+marker);
          }
          const text=Object.entries(files).filter(([n])=>/\.(json|brs|xml|html|txt)$/i.test(n)).map(([,b])=>b.toString()).join('\n');
          assert(!text.includes('example.invalid'));
          assert(!text.includes('fixture-scenario.json'));
          assert(!/AIza[0-9A-Za-z_-]{35}|-----BEGIN (?:RSA |EC )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{30,}/.test(text));
          console.log(JSON.stringify({...built,catalog:607,coverAssociations:578,integrationsEnabled:false,secretsDetected:0}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: RochaPlus-Roku-LAB-0.6.10-REV4-CATALOGO-607-PLAYBACK-BLOQUEADO
          path: /tmp/RochaPlus-Roku-LAB-0.6.10-REV4-CATALOGO-607-PLAYBACK-BLOQUEADO.zip
          if-no-files-found: error
          retention-days: 30
