name: Rocha+ Sandbox Payment Receipt Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sandbox-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/spark-payment-confirmation-20261015
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test seller
        env:
          MP_TEST_ACCESS_TOKEN: ${{ secrets.MP_TEST_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_SELLER_ID: '3717765439'
        run: node backend/mercadopago_sandbox_check.js
      - name: Verify existing sandbox payment without writes
        env:
          MP_TEST_ACCESS_TOKEN: ${{ secrets.MP_TEST_ACCESS_TOKEN }}
          MP_EXPECTED_TEST_SELLER_ID: '3717765439'
          MP_EXPECTED_TEST_BUYER_ID: '3717765441'
          MP_TEST_PAYMENT_ID: '184246702490'
        run: node backend/mercadopago_sandbox_receipt.js
