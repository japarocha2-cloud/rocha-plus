name: TV shared examples (experimental)
on:
  push:
    branches:
      - homolog/technical-candidate-20261028
    paths:
      - 'tools/*tv*catalog*.py'
      - 'tools/*tv*fixtures*.py'
      - 'tools/*shared_tv*.py'
      - 'branding/lab_candidates.json'
      - 'docs/tv/roku-android-parity-12.json'
      - 'lib/src/live/tv_parity_lab.dart'
      - 'lib/src/screens/lab_entry_screen.dart'
      - 'test/tv_parity_lab_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/tv-shared-examples.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  tv-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated TV tests
        run: |
          PYTHONPATH=tools python -m unittest discover -s tools -p 'test_*tv*.py' -v
      - name: Export identical Roku and Android TV examples
        run: |
          python tools/export_shared_tv_examples.py --limit 12
          python tools/prepare_tv_channel_fixtures.py --limit 12
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("build/tv-shared-test")
          roku=(root/"roku/catalog-test.json").read_bytes()
          android=(root/"android-tv/catalog-test.json").read_bytes()
          assert roku==android, "Roku/Android TV example parity failed"
          records=json.loads(roku)
          assert all(x["approved"] is False and x["quarantined"] is True for x in records)
          assert len(records)>0, "No HTTPS candidates available"
          print(f"{len(records)} experimental examples prepared identically")
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate isolated Android TV LAB scaffold
        run: |
          flutter create --platforms=android --project-name=rocha_plus "$RUNNER_TEMP/tv-scaffold"
          cp -R "$RUNNER_TEMP/tv-scaffold/android" android
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 37/' android/app/build.gradle.kts
          python3 tools/configure_android.py
          python3 tools/lab/configure.py
      - name: Test Android TV parity asset and loader
        run: |
          flutter pub get
          python3 tools/lab/patch_vlc_lifecycle.py
          flutter pub get
          python3 tools/lab/verify_vlc_protocol.py
          flutter analyze
          flutter test
      - name: Build isolated Android TV debug APK (12 channels, no release)
        run: |
          flutter build apk --debug --dart-define=ROCHA_LAB_ONLY=true --dart-define=ROCHA_TV_PARITY_12=true
          mkdir -p build/tv-parity-apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/tv-parity-apk/RochaPlus-AndroidTV-Paridade12-LAB-debug.apk
          cp pubspec.lock build/tv-parity-apk/
          cp build/lab/vlc-*.json build/tv-parity-apk/
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/tv-parity-apk/*.apk | tee build/tv-parity-apk/signature.txt
          "$BUILD_TOOLS/aapt" dump badging build/tv-parity-apk/*.apk | tee build/tv-parity-apk/badging.txt
          grep -q "package: name='com.rochaplus.app.lab'" build/tv-parity-apk/badging.txt
          grep -q "application-debuggable" build/tv-parity-apk/badging.txt
          grep -q "android.intent.category.LEANBACK_LAUNCHER" <("$BUILD_TOOLS/aapt" dump xmltree build/tv-parity-apk/*.apk AndroidManifest.xml)
          cd build/tv-parity-apk
          sha256sum RochaPlus-AndroidTV-Paridade12-LAB-debug.apk > SHA256SUMS
      - name: Upload Android TV debug APK (LAB only)
        uses: actions/upload-artifact@v4
        with:
          name: rocha-android-tv-parity12-lab-debug
          path: build/tv-parity-apk/
          retention-days: 14
          if-no-files-found: error
      - name: Upload isolated examples (not app packages)
        uses: actions/upload-artifact@v4
        with:
          name: rocha-tv-shared-examples
          path: |
            build/tv-shared-test/
            build/tv-channel-fixtures/
          retention-days: 14
