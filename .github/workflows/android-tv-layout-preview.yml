name: Rocha+ Android TV visual diagnostic
on:
  push:
    branches: [feat/android-tv-universal-20261018]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tv-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare universal manifest
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle.kts')
          p.write_text(p.read_text().replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 37'))
          PY
          python3 tools/configure_android.py
      - name: Verify approved catalog
        run: python3 tools/sync_platform_baseline.py --check
      - run: flutter pub get
      - run: flutter analyze
      - name: Test TV layout and control navigation
        run: flutter test
      - name: Build diagnostic APK
        run: flutter build apk --debug --dart-define=ROCHA_SPARK_TRIAL=false
      - uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-android-tv-layout-roku-style
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
