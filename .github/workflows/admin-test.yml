name: Rocha+ ADM Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare Android
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('compileSdk = flutter.compileSdkVersion','compileSdk = 37')
          p.write_text(s)
          PY
          python3 tools/configure_android.py
      - name: Isolate administrator package and label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text().replace('com.rochaplus.app','com.rochaplus.admin.test').replace('com.example.rocha_plus','com.rochaplus.admin.test')
          p.write_text(s)
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text().replace('android:label="Rocha+"','android:label="Rocha+ ADM"')
          p.write_text(s)
          PY
      - name: Prepare Firebase configuration
        env:
          ROCHA_FIREBASE_CONFIG_JSON: ${{ secrets.ROCHA_FIREBASE_CONFIG_JSON }}
          ROCHA_KEYSTORE_BASE64: ${{ secrets.ROCHA_KEYSTORE_BASE64 }}
          ROCHA_KEYSTORE_PASSWORD: ${{ secrets.ROCHA_KEYSTORE_PASSWORD }}
          ROCHA_KEY_ALIAS: ${{ secrets.ROCHA_KEY_ALIAS }}
        run: python3 tools/prepare_signed_build.py
      - run: flutter pub get
      - name: Analyze separate admin entry point
        run: flutter analyze lib/admin_main.dart lib/src/screens/admin_trial_test_screen.dart
      - name: Build ADM APK
        run: flutter build apk --release --target lib/admin_main.dart --dart-define-from-file="$ROCHA_FIREBASE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-adm-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
