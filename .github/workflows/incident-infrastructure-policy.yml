name: Incident infrastructure policy (no customer data)
on:
  push:
    branches: [incident/payment-recognition-20261103]
    paths: [.github/workflows/incident-infrastructure-policy.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  new-probe-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f36167c6e94d7b90ea6a31ecbed8cc85079bdb85
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test backend/entitlement/credential_policy_probe.test.mjs
  infrastructure-policy:
    needs: new-probe-tests
    if: github.repository == 'japarocha2-cloud/rocha-plus' && github.ref == 'refs/heads/incident/payment-recognition-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f36167c6e94d7b90ea6a31ecbed8cc85079bdb85
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: backend/entitlement
      - name: Infrastructure access statuses only; no Auth users, documents or payments
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node backend/entitlement/diagnostics/actions_infrastructure_readonly.mjs
