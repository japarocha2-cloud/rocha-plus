name: Incident payment evidence 20261103 (read-only)
on:
  push:
    branches: [incident/payment-recognition-20261103]
    paths: [.github/workflows/incident-payment-readonly-20261103.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  account-audit:
    if: github.repository == 'japarocha2-cloud/rocha-plus' && github.ref == 'refs/heads/incident/payment-recognition-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout reviewed read-only diagnostic revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6b7faf8a1b920427b64b5353ee2d17672b139648
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked SDK without lifecycle scripts
        working-directory: backend/entitlement
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read existing payments and selected Firebase account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          MP_RECEIVING_ACCESS_TOKEN: ${{ secrets.MP_RECEIVING_ACCESS_TOKEN }}
          EXPECTED_RECEIVING_MERCHANT_ID: '320683687'
        run: node backend/entitlement/diagnostics/paid_account_readonly.mjs
