name: R.L Laboratorio Windows
on:
  push:
    branches:
      - feat/channel-lab-import-export-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Generate Windows runner
        run: flutter create --platforms=windows .
      - name: Set R.L name and desktop icon
        run: |
          python -m pip install Pillow
          python tools/create_lab_icon.py windows
      - name: Install packages
        run: flutter pub get
      - name: Allow deprecated coroutine header used by Windows plugin
        shell: pwsh
        run: |
          $cmake = 'windows/CMakeLists.txt'
          $content = Get-Content $cmake -Raw
          $content = "add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`n" + $content
          Set-Content $cmake $content
      - name: Build Windows laboratory
        run: flutter build windows --release --target=lib/main_channel_lab.dart
      - name: Pack Windows exe and required DLLs
        shell: pwsh
        run: |
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'RL-Laboratorio-Windows.zip'
      - name: Upload Windows desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: RL-Laboratorio-Windows
          path: RL-Laboratorio-Windows.zip
          if-no-files-found: error
