name: LAB intelligent cleanup inventory
on:
  push:
    branches: [lab/limpeza-inteligente-p0-20261108]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python3 -m pip install Pillow==13.0.0 numpy
      - name: Verify audit behavior and existing Android tooling
        run: |
          python3 - <<'PY'
          import subprocess
          import sys
          for directory in ['tools/audit', 'tools', 'tools/lab']:
              result=subprocess.run([sys.executable,'-m','unittest','discover','-s',directory,'-p','test_*.py'],capture_output=True,text=True)
              print(result.stdout, result.stderr)
              if result.returncode:
                  detail=(result.stdout+result.stderr)[-5000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::error title=Test failure '+directory+'::'+detail)
                  sys.exit(result.returncode)
          PY
      - name: Ensure MP4 inspection tool is available
        run: |
          if ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Inventory tracked snapshot without mutations
        run: |
          python3 tools/audit/inventory.py --ref HEAD --output /tmp/cleanup-inventory.json
          python3 - <<'PY'
          import json
          rows=json.load(open('/tmp/cleanup-inventory.json'))
          assert rows and rows[0]['files']
          for failure in rows[0]['formatFailures']:
              detail=json.dumps(failure).replace('%','%25').replace('\n','%0A')
              print('::error title=Format validation::'+detail)
          assert not rows[0]['formatFailures'], rows[0]['formatFailures']
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: cleanup-inventory
          path: /tmp/cleanup-inventory.json
