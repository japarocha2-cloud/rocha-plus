name: Rocha+ Soul TV APK isolated

on:
  push:
    branches: [feat/soul-tv-candidates-20261016, feat/layout-proportions-20261017]
    paths:
      - '.github/workflows/soul-tv-build-dispatch.yml'
      - 'lib/src/**'
      - 'lib/main.dart'
      - 'catalog/**'
      - 'pubspec*'
      - 'test/**'
      - '!test/packaged_catalog_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    if: ${{ !startsWith(github.event.head_commit.message, 'diagnostic:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ROCHA_SPARK_TRIAL: ${{ vars.ROCHA_SPARK_TRIAL }}
      ROCHA_BILLING_API_URL: ${{ vars.ROCHA_BILLING_API_URL }}
      ROCHA_ROKU_PAIRING_ENDPOINT: ${{ vars.ROCHA_ROKU_PAIRING_ENDPOINT }}
      ROCHA_KEYSTORE_PASSWORD: ${{ secrets.ROCHA_KEYSTORE_PASSWORD }}
      ROCHA_KEY_ALIAS: ${{ secrets.ROCHA_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Configure Android scaffold
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle.kts")
          s=path.read_text().replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 37")
          path.write_text(s)
          PY
          python3 tools/configure_android.py
      - name: Isolate test installation from frozen APK
        run: python3 tools/isolate_test_android.py
      - name: Validate catalog (SBC unique, ISTV unique)
        run: |
          python3 - <<'PY'
          import json
          items=json.load(open('catalog/approved.json'))
          for key in ['SBC TV','ISTV']:
            matches=[x for x in items if key.lower() in x['name'].lower()]
            assert len(matches)==1,(key,len(matches))
          for key in ['TV Mais Brasil','TV da Quebrada']:
            assert not any(key.lower() in x['name'].lower() for x in items),key+' not yet validated'
          print('catalog guard passed')
          PY
      - name: Test isolated Firebase configuration guards
        run: node --test tools/candidate_firebase.test.mjs
      - name: Restore existing private signing inputs
        env:
          ROCHA_KEYSTORE_BASE64: ${{ secrets.ROCHA_KEYSTORE_BASE64 }}
          ROCHA_FIREBASE_CONFIG_JSON: ${{ secrets.ROCHA_FIREBASE_CONFIG_JSON }}
        run: python3 tools/prepare_signed_build.py
      - name: Register and verify isolated Firebase app and Google OAuth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node tools/prepare_candidate_firebase.mjs
      - run: flutter pub get
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/rocha_quality_guard.py
      - run: flutter analyze
      - run: flutter test
      - name: Build signed isolated candidate with Firebase enabled
        run: |
          flutter build apk --release --build-number=7 --build-name=0.1.0-test-infantil \
            --dart-define="ROCHA_SPARK_TRIAL=$ROCHA_SPARK_TRIAL" \
            --dart-define="ROCHA_BILLING_API_URL=$ROCHA_BILLING_API_URL" \
            --dart-define="ROCHA_ROKU_PAIRING_ENDPOINT=$ROCHA_ROKU_PAIRING_ENDPOINT" \
            --dart-define-from-file="$ROCHA_FIREBASE_FILE"
      - name: Verify candidate APK exists
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" > /tmp/candidate-badging.txt
          grep "^package:" /tmp/candidate-badging.txt
          grep -q "name='com.rochaplus.soultvtest'" /tmp/candidate-badging.txt
          grep -q "launchable-activity: name='com.rochaplus.app.MainActivity'" /tmp/candidate-badging.txt
          "$SIGNER" verify --verbose "$APK"
          unzip -t "$APK" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          paths = [f'branding/categories/mobile/{name}.png' for name in
                   ['tv_ao_vivo', 'esportes', 'infantil', 'noticias']]
          paths += ['branding/ads/bau.png', 'branding/ads/publicidade_jornal.png']
          with ZipFile('build/app/outputs/flutter-apk/app-release.apk') as apk:
              for path in paths:
                  assert apk.read('assets/flutter_assets/' + path) == Path(path).read_bytes(), path
                  print('APK artwork verified:', path)
          PY
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: rocha-plus-soul-tv-teste-login-assinado
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Delete private signing and Firebase files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/rocha-private"
