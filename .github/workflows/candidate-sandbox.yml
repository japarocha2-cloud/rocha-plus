name: Candidate and isolated sandbox checks
on:
  push:
    branches: [homolog/technical-candidate-20261028]
    paths:
      - 'functions/sandbox/**'
      - 'functions/entitlement_periods.js'
      - 'functions/reconcile_and_grant.js'
      - 'functions/mercadopago_reconciliation.js'
      - 'tools/candidate/**'
      - '.github/workflows/candidate-sandbox.yml'
permissions:
  contents: read
jobs:
  sandbox-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-rocha-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked SDK without lifecycle scripts
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Exercise sandbox fixtures with isolated real transactions
        run: npx --yes firebase-tools@15.34.1 emulators:exec --only firestore --project demo-rocha-sandbox --config functions/sandbox/firebase.json 'node --test functions/sandbox/reconcile.test.js'
  candidate-configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check independent identity, OAuth and signing preparation
        run: python3 -m unittest discover -s tools/candidate -p 'test_*.py' -v
