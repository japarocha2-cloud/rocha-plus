name: rocha_plus
description: Rocha+ streaming player for public and authorized channels.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_chrome_cast: 1.5.0
  shared_preferences: ^2.5.3
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - branding/rocha_plus_icon.webp
    - branding/dashboard-reference.png
    - branding/cast-reference.png
